name: Fix XLSX hash PHPStan

on:
  pull_request:
    paths:
      - '.github/workflows/phase3-xlsx-hash-phpstan-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply deterministic hash comparison fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('plugin/wla-inmo/src/Import/XlsxDocumentReader.php')
          text = path.read_text()
          old = "\t\t\tif (!hash_equals($inspection['source_hash'], $this->hashLockedHandle($handle))) {\n\t\t\t\t@unlink($ndjsonPath); // phpcs:ignore WordPress.PHP.NoSilencedErrors.Discouraged -- Plugin-created invalid normalized source cleanup.\n\t\t\t\tthrow new XlsxException('source_changed_during_normalization', 'XLSX source changed during normalization.');\n\t\t\t}"
          new = "\t\t\t$afterSourceHash = $this->hashLockedHandle($handle);\n\t\t\tif ($inspection['source_hash'] !== $afterSourceHash) {\n\t\t\t\t@unlink($ndjsonPath); // phpcs:ignore WordPress.PHP.NoSilencedErrors.Discouraged -- Plugin-created invalid normalized source cleanup.\n\t\t\t\tthrow new XlsxException('source_changed_during_normalization', 'XLSX source changed during normalization.');\n\t\t\t}"
          if text.count(old) != 1:
              raise SystemExit(f'expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin/wla-inmo/src/Import/XlsxDocumentReader.php
          git commit -m 'fix(import): keep post-normalization XLSX hash guard analyzable'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
