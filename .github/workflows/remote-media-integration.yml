name: Remote Media Integration

on:
  workflow_call:
  pull_request:
    paths:
      - 'plugin/wla-inmo/src/Import/*RemoteMedia*.php'
      - 'plugin/wla-inmo/src/Import/NetworkAddressPolicy.php'
      - 'plugin/wla-inmo/src/Import/DnsResolverInterface.php'
      - 'plugin/wla-inmo/src/Import/SystemDnsResolver.php'
      - 'plugin/wla-inmo/src/Import/RowExecutor.php'
      - 'plugin/wla-inmo/src/Import/TargetRegistry.php'
      - 'plugin/wla-inmo/src/Import/ValueNormalizer.php'
      - 'plugin/wla-inmo/src/Import/JsonDocumentReader.php'
      - 'plugin/wla-inmo/src/Import/WordPressJsonExportSource.php'
      - 'tests/unit/ImportRemoteMedia*.php'
      - 'tests/integration/assert-remote-media.php'
      - 'tests/phpstan/wordpress-import-stubs.php'
      - '.github/workflows/remote-media-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-media:
    name: PHP ${{ matrix.php }} / secure remote media
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: ctype,dom,fileinfo,filter,gd,iconv,libxml,mbstring,simplexml,xml,xmlreader,xmlwriter,zip,zlib
          tools: composer:v2
          coverage: none

      - name: Install locked dependencies
        run: composer install --working-dir=plugin/wla-inmo --no-interaction --no-progress --prefer-dist

      - name: Validate remote media unit contracts
        run: plugin/wla-inmo/vendor/bin/phpunit -c phpunit.xml.dist --filter ImportRemoteMedia

      - name: PHPStan domain gate
        run: plugin/wla-inmo/vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress

      - name: Source contract smoke
        run: |
          grep -F 'FILTER_FLAG_NO_PRIV_RANGE' plugin/wla-inmo/src/Import/NetworkAddressPolicy.php
          grep -F "array('http', 'https')" plugin/wla-inmo/src/Import/RemoteMediaUrlPolicy.php
          grep -F 'wp_safe_remote_get' plugin/wla-inmo/src/Import/RemoteMediaWordPressHttpClient.php
          grep -F "'redirection'         => \$maxRedirects" plugin/wla-inmo/src/Import/RemoteMediaWordPressHttpClient.php
          grep -F "'stream'              => true" plugin/wla-inmo/src/Import/RemoteMediaWordPressHttpClient.php
          grep -F "'limit_response_size' => \$maxBytes + 1" plugin/wla-inmo/src/Import/RemoteMediaWordPressHttpClient.php
          grep -F "'reject_unsafe_urls'  => true" plugin/wla-inmo/src/Import/RemoteMediaWordPressHttpClient.php
          grep -F "'sslverify'           => true" plugin/wla-inmo/src/Import/RemoteMediaWordPressHttpClient.php
          grep -F "'image/webp'" plugin/wla-inmo/src/Import/RemoteMediaImageInspector.php
          grep -F 'media_handle_sideload' plugin/wla-inmo/src/Import/WordPressRemoteMediaAttachmentStore.php
          grep -F "_wla_inmo_remote_media_sha256" plugin/wla-inmo/src/Import/WordPressRemoteMediaAttachmentStore.php
          grep -F 'hash('"'"'sha256'"'"', $file->url())' plugin/wla-inmo/src/Import/WordPressRemoteMediaAttachmentStore.php
