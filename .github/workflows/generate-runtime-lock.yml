name: Generate Runtime Lock

on:
  pull_request:
    paths:
      - 'plugin/wla-inmo/composer.json'
      - '.github/workflows/generate-runtime-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    name: Composer lock / PHP 8.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: ctype,dom,fileinfo,filter,gd,iconv,libxml,mbstring,simplexml,xml,xmlreader,xmlwriter,zip,zlib
          tools: composer:v2
          coverage: none

      - name: Resolve dependency lock
        run: |
          rm -f plugin/wla-inmo/composer.lock
          composer update \
            --working-dir=plugin/wla-inmo \
            --no-install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Validate resolved lock
        run: |
          composer validate --strict --working-dir=plugin/wla-inmo
          composer audit --working-dir=plugin/wla-inmo --format=json | tee "$RUNNER_TEMP/composer-audit.json"

      - name: Commit validated lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/wla-inmo/composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock already matches resolved dependencies."
          else
            git commit -m "build: lock XLSX runtime dependency"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Upload lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: wla-inmo-composer-lock
          path: |
            plugin/wla-inmo/composer.lock
            ${{ runner.temp }}/composer-audit.json
          if-no-files-found: error
          retention-days: 30
