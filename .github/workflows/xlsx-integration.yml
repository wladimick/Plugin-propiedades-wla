name: XLSX Integration

on:
  pull_request:
    paths:
      - 'plugin/wla-inmo/composer.json'
      - 'plugin/wla-inmo/composer.lock'
      - 'plugin/wla-inmo/src/Import/Xlsx*.php'
      - 'plugin/wla-inmo/src/Import/Workspace.php'
      - 'plugin/wla-inmo/src/Import/BatchRepository.php'
      - 'plugin/wla-inmo/src/Import/BatchRunner.php'
      - 'plugin/wla-inmo/src/Admin/ImportExportHub.php'
      - 'plugin/wla-inmo/src/Admin/ImportExportPage.php'
      - 'tests/unit/ImportXlsx*.php'
      - 'bin/build-plugin.sh'
      - '.github/workflows/xlsx-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phpstan-fix:
    name: One-shot XLSX PHPStan cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply deterministic typing cleanup
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 occurrence, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          path = 'plugin/wla-inmo/src/Import/Workspace.php'
          replace_once(
              path,
              "$sheets = isset($inspection['sheets']) && is_array($inspection['sheets']) ? $inspection['sheets'] : array();",
              "$sheets = $inspection['sheets'];"
          )

          path = 'plugin/wla-inmo/src/Import/XlsxArchiveInspector.php'
          replace_once(path, "$sourceBytes = isset($before['size']) ? (int) $before['size'] : 0;", "$sourceBytes = (int) $before['size'];")
          replace_once(path, "if (!is_array($stat) || !isset($stat['name'])) {", "if ($stat === false) {")
          replace_once(path, "$uncompressed = isset($stat['size']) ? (int) $stat['size'] : 0;", "$uncompressed = (int) $stat['size'];")
          replace_once(path, "$compressed = isset($stat['comp_size']) ? (int) $stat['comp_size'] : 0;", "$compressed = (int) $stat['comp_size'];")
          replace_once(path, "if (isset($stat['encryption_method']) && (int) $stat['encryption_method'] !== 0) {", "if ((int) $stat['encryption_method'] !== 0) {")
          replace_once(path, "if (!is_array($stat)) {\n\t\t\tthrow new XlsxException('entry_stat_failed', 'XLSX metadata part could not be inspected.');\n\t\t}", "if ($stat === false) {\n\t\t\tthrow new XlsxException('entry_stat_failed', 'XLSX metadata part could not be inspected.');\n\t\t}")
          replace_once(path, "$size = isset($stat['size']) ? (int) $stat['size'] : 0;", "$size = (int) $stat['size'];")
          replace_once(path, "\tprivate function hashLockedHandle($handle): string", "\t/** @param resource $handle */\n\tprivate function hashLockedHandle($handle): string")
          replace_once(path, "/** @param array<string|int,mixed> $before @param array<string|int,mixed> $after */", "/**\n\t * @param array<int|string,int> $before\n\t * @param array<int|string,int> $after\n\t */")

          path = 'plugin/wla-inmo/src/Import/XlsxDocumentReader.php'
          replace_once(path, "use PhpOffice\\PhpSpreadsheet\\Reader\\Xlsx;", "use PhpOffice\\PhpSpreadsheet\\Reader\\Xlsx;\nuse PhpOffice\\PhpSpreadsheet\\Worksheet\\Worksheet;")
          replace_once(path, "$name = (string) ($worksheet['worksheetName'] ?? '');", "$name = (string) $worksheet['worksheetName'];")
          replace_once(path, "$totalRows = max(0, (int) ($worksheet['totalRows'] ?? 0));", "$totalRows = max(0, (int) $worksheet['totalRows']);")
          replace_once(path, "$totalColumns = max(0, (int) ($worksheet['totalColumns'] ?? 0));", "$totalColumns = max(0, (int) $worksheet['totalColumns']);")
          replace_once(path, "\n\t\t\t\t\t\t$data = array_combine($headers, $values);\n\t\t\t\t\t\tif (!is_array($data)) {\n\t\t\t\t\t\t\tthrow new XlsxException('row_shape_failed', 'XLSX row could not be associated with its headers.', $rowNumber);\n\t\t\t\t\t\t}\n", "\n\t\t\t\t\t\t$data = array_combine($headers, $values);\n")
          replace_once(path, "if (!is_string($sourceHash) || preg_match('/^[a-f0-9]{64}$/', $sourceHash) !== 1) {", "if (preg_match('/^[a-f0-9]{64}$/', $sourceHash) !== 1) {")
          replace_once(path, "if (!is_array($info) || $info === array()) {", "if ($info === array()) {")
          replace_once(path, "\t/** @return array<int,string> */\n\tprivate function rowValues($worksheet, int $rowNumber, int $columns): array", "\t/** @return array<int,string> */\n\tprivate function rowValues(Worksheet $worksheet, int $rowNumber, int $columns): array")
          replace_once(path, "\t/** @param array<int,string> $values @return array<int,string> */\n\tprivate function normalizeHeaders(array $values): array", "\t/**\n\t * @param array<int,string> $values\n\t * @return array<int,string>\n\t */\n\tprivate function normalizeHeaders(array $values): array")
          replace_once(path, "\tprivate function openOutput(string $path)\n", "\t/** @return resource */\n\tprivate function openOutput(string $path)\n")
          replace_once(path, "\tprivate function hashLockedHandle($handle): string", "\t/** @param resource $handle */\n\tprivate function hashLockedHandle($handle): string")

      - name: Commit typing cleanup if changed
        run: |
          if git diff --quiet; then
            echo 'No PHPStan cleanup changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin/wla-inmo/src/Import/Workspace.php \
                  plugin/wla-inmo/src/Import/XlsxArchiveInspector.php \
                  plugin/wla-inmo/src/Import/XlsxDocumentReader.php
          git commit -m 'fix(import): satisfy XLSX static analysis'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

  xlsx:
    name: PHP ${{ matrix.php }} / bounded XLSX
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: ctype,dom,fileinfo,filter,gd,iconv,libxml,mbstring,simplexml,xml,xmlreader,xmlwriter,zip,zlib
          tools: composer:v2
          coverage: none

      - name: Validate locked dependency graph
        run: |
          composer validate --strict --working-dir=plugin/wla-inmo
          composer install --working-dir=plugin/wla-inmo --no-interaction --no-progress --prefer-dist
          composer audit --working-dir=plugin/wla-inmo
          composer check-platform-reqs --working-dir=plugin/wla-inmo --no-dev

      - name: Run XLSX unit contracts
        run: plugin/wla-inmo/vendor/bin/phpunit -c phpunit.xml.dist --filter ImportXlsx

      - name: Build installable plugin
        id: build
        run: |
          ZIP_PATH="$(bash bin/build-plugin.sh)"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          test -f "$ZIP_PATH"
          stat -c '%s' "$ZIP_PATH" | tee "$RUNNER_TEMP/release-zip-bytes.txt"
          sha256sum "$ZIP_PATH" | tee "$RUNNER_TEMP/release-zip.sha256"

      - name: Release ZIP smoke
        run: bash bin/smoke-plugin.sh "${{ steps.build.outputs.zip_path }}"

      - name: Upload XLSX build evidence
        uses: actions/upload-artifact@v4
        with:
          name: xlsx-build-php-${{ matrix.php }}
          path: |
            ${{ runner.temp }}/release-zip-bytes.txt
            ${{ runner.temp }}/release-zip.sha256
          if-no-files-found: error
          retention-days: 30
