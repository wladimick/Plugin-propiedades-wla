name: Phase 3 Import UI PHPStan Fix

on:
  push:
    branches:
      - feat/phase3-import-ui
    paths:
      - '.github/workflows/phase3-import-ui-phpstan-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase3-import-ui
          fetch-depth: 0

      - name: Apply PHPStan fixes
        run: python3 bin/phase3-import-ui-phpstan-fix.py

      - name: Commit fixes
        run: |
          git config user.name "WLA Inmo CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(import): satisfy static analysis for workspace cleanup"
          git push origin HEAD:feat/phase3-import-ui
